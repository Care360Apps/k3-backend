name: K3 Laravel source checks (offline)
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'default' }}
  cancel-in-progress: true
jobs:
  syntax-and-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, xml, curl, openssl, fileinfo
          tools: composer:v2
      - name: PHP manifest validity
        run: composer validate --no-check-publish
      - name: Syntax checks without production database
        run: |
          find app config database routes tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file" >/dev/null || exit 1; done
      - name: Isolated mobile profile image regression cases
        run: php tools/test_profile_image_upload.php
      - name: Isolated OTP verification regression cases
        run: php tools/test_otp_verification.php
      - name: Isolated payment verification regression cases
        run: php tools/test_payment_verification.php
      - name: No payment status forgery through appointment completion
        run: php tools/test_payment_completion_contract.php
      - name: Private medical authorization and storage source contract
        run: php tools/test_private_medical_download_contract.php
      - name: Private prescription write cutoff source contract (opt-in)
        run: php tools/test_private_prescription_write_contract.php
      - name: Private/legacy route runtime regression (no Laravel or database)
        run: |
          php -l tools/test_private_prescription_urls_runtime.php
          php tools/test_private_prescription_urls_runtime.php
      - name: Read-only runtime configuration preflight source guard
        run: php tools/test_security_preflight_contract.php
      - name: Reversible synthetic medical-file staging and payment safety gates
        run: |
          php -l app/Console/Commands/StageLegacyPrescriptions.php
          php -l database/migrations/2026_11_08_060000_create_medical_prescription_migration_ledger.php
          php -l tests/Feature/LegacyPrescriptionStagingTest.php
          php tools/test_medical_migration_contract.php
          php tools/test_stripe_charge_binding_contract.php
          php tools/test_subscription_activation_contract.php
      - name: Provider approval and valid proximity discovery
        run: php tools/test_provider_discovery_contract.php
      - name: Opt-in Nearby Care shift and location privacy safety
        run: php tools/test_nearby_care_presence_contract.php
      - name: Synthetic Nearby Care staging smoke test self-check (no network)
        run: python3 tools/staging_nearby_care_smoke.py --offline-self-test
      - name: Guard three-role local BlueStacks demo against production seeding
        run: php tools/test_local_demo_seeder_contract.php
      - name: PHP syntax of presence and migration
        run: |
          php -l app/Http/Controllers/NearbyCareController.php
          php -l database/migrations/2026_11_07_000001_create_professional_service_presence_table.php
      - name: Static chat push safety contract checks (no backend calls)
        run: python3 tools/k3_chat_push_contract_test.py
      - name: Synthetic staging login safety tests (offline; no HTTP)
        run: python3 tools/test_k3_staging_login_smoke.py
      - name: Professional consultation role and permission regression (offline)
        run: php -d zend.assertions=1 -d assert.exception=1 tools/test_consultation_capabilities.php
      - name: Pharmacy commission and preview safety (offline)
        run: php tools/test_pharmacy_commission.php
      - name: Clinical encounter notes confidentiality contract (offline)
        run: php tools/test_doctor_notes_contract.php
      - name: Agora session lifetime regression (offline)
        run: php tools/test_agora_session_policy.php
      - name: Pharmacy atomic stock capacity safety (offline)
        run: php tools/test_pharmacy_stock_guard.php
      - name: Paid sponsor campaign safety and admin source contract
        run: php tools/test_partner_campaign_contract.php
      - name: Secure Places and gated AI contract tests (offline)
        run: |
          php tools/test_places_gateway_contract.php
          python3 tools/test_ai_guide_contract.py
      - name: Workforce accounts stay isolated from clinical records
        run: php tools/test_workforce_pilot_contract.php
      - name: Protect against committed credentials and dumps
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|oauth-private\.key$|key\.properties$|.*\.(jks|keystore|p8|pem|sqlite|db)$|doctro\.sql$|firebase-service-account\.json$|.*service-account.*\.json$)'; then
            echo 'Restricted data or secrets included'; exit 1
          fi

  laravel-synthetic-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      K3_PRIVATE_PRESCRIPTION_WRITES: "false"
      K3_SYNTHETIC_MEDICAL_MIGRATION: "true"
      K3_WORKFORCE_PILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, xml, curl, openssl, fileinfo, zip
          tools: composer:v2
      - name: Install locked dependencies offline from the service's code
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Ephemeral test-only Laravel key
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: Test private prescription storage, ownership, rollback and isolated workforce
        run: php artisan test --filter='(PrivatePrescriptionAccessTest|PrivatePrescriptionWriteTest|LegacyPrescriptionStagingTest|WorkforcePilotTest)' --stop-on-failure
